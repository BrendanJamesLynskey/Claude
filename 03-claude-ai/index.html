  <style>
  :root {
    --amber:  #dcad61;
    --green:  #a9cd8e;
    --purple: #ba9ecc;
    --blue:   #73b9b4;
    --bg:     #1c1815;
    --bg2:    #231e1a;
    --border: #403831;
    --text:   #ede5d9;
    --muted:  #988d82;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Instrument Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(220,173,97,0.1) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(169,205,142,0.06) 0%, transparent 50%);
    pointer-events: none;
  }
  .accent-border-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    box-shadow: 0 0 15px rgba(220,173,97,0.3);
  }
  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 500px;
  }
  .series-label {
    font-family: 'Geist Mono', monospace;
    font-size: .7em;
    color: var(--muted);
    letter-spacing: .12em;
    margin-bottom: .5em;
  }
  .num {
    font-family: 'Geist Mono', monospace;
    font-size: .8em;
    font-weight: 500;
    color: var(--bg);
    background: var(--amber);
    padding: .1em .45em;
    border-radius: 3px;
    letter-spacing: .04em;
    display: inline-block;
    margin-bottom: .8em;
  }
  h1 {
    font-family: 'Bricolage Grotesque', serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    color: var(--amber);
    line-height: 1.15;
    margin-bottom: .15em;
  }
  .subtitle {
    font-size: clamp(.8rem, 2.5vw, .95rem);
    color: var(--green);
    font-weight: 300;
    letter-spacing: .03em;
    margin-bottom: .5em;
  }
  .description {
    font-size: .85rem;
    font-weight: 300;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 2rem;
  }
  .bar {
    width: 50px; height: 2px;
    background: var(--amber);
    margin: 0 auto 1.8em;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: .8em;
    align-items: center;
  }
  a.btn {
    display: inline-block;
    text-decoration: none;
    font-family: 'Instrument Sans', sans-serif;
    font-size: .9rem;
    font-weight: 400;
    letter-spacing: .1em;
    padding: 14px 48px;
    border-radius: 30px;
    transition: all .3s ease;
    width: 260px;
    text-align: center;
  }
  a.btn.primary {
    color: var(--text);
    background: rgba(220,173,97,0.12);
    border: 1px solid rgba(220,173,97,0.4);
    box-shadow: 0 4px 20px rgba(220,173,97,0.1);
  }
  a.btn.primary:hover {
    background: rgba(220,173,97,0.2);
    border-color: var(--amber);
    box-shadow: 0 4px 30px rgba(220,173,97,0.2);
  }
  a.btn.secondary {
    color: var(--muted);
    background: rgba(250,246,240,0.04);
    border: 1px solid rgba(250,246,240,0.1);
  }
  a.btn.secondary:hover {
    background: rgba(250,246,240,0.08);
    border-color: rgba(250,246,240,0.2);
    color: var(--text);
  }
  .badge {
    font-size: .65rem;
    letter-spacing: .1em;
    color: var(--amber);
    opacity: .7;
    margin-left: .5rem;
  }
  .back {
    margin-top: 2em;
    font-size: .78rem;
    color: var(--muted);
  }
  .back a {
    color: var(--amber);
    text-decoration: none;
    letter-spacing: .04em;
  }
  .back a:hover { text-decoration: underline; }
  </style>

<!-- deck-concept:start --><div class="cx-head" aria-hidden="true"><span>Anthropic Claude</span><span>Presentation 03</span></div><figure class="cx-fig"><div class="tx-card" role="img" aria-label="An illustrative exchange"><div class="tx-turn tx-h"><span class="tx-who">You</span><p>Keep our style guide in mind for this project.</p></div><div class="tx-turn tx-a"><span class="tx-who">Claude</span><p>Added it to the project knowledge. Every chat in this project will use it.</p></div></div><figcaption>An illustrative exchange for this section.</figcaption></figure><!-- deck-concept:end -->
    <div class="series-label">ANTHROPIC CLAUDE SERIES</div>

    <h1>Claude.ai — The Web Interface</h1>
    <div class="subtitle">Projects, Artifacts, extended thinking, styles, file uploads, and team features</div>
    <div class="bar"></div>
    <p class="description">Choose your viewing experience</p>
    <div class="buttons">
      <a href="desktop.html" class="btn" id="btnDesktop">DESKTOP</a>
      <a href="mobile.html" class="btn" id="btnMobile">MOBILE</a>
    </div>
    <div class="back"><a href="../">&larr; All presentations</a></div>
  </div>
  <script>
  var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                 (navigator.maxTouchPoints > 1 && window.innerWidth < 768);
  var btnD = document.getElementById('btnDesktop');
  var btnM = document.getElementById('btnMobile');
  if (isMobile) {
    btnM.classList.add('primary');
    btnD.classList.add('secondary');
    btnM.innerHTML += '<span class="badge">RECOMMENDED</span>';
  } else {
    btnD.classList.add('primary');
    btnM.classList.add('secondary');
    btnD.innerHTML += '<span class="badge">RECOMMENDED</span>';
  }
  </script>
